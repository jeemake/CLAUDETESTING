<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des arrêts de Gbaka - Cocody, Abidjan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
        }

        #header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            position: relative;
            border-bottom: 2px solid #FF6B00;
        }

        #header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #FF6B00, #FFB347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #header .subtitle {
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        #header .logo {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 107, 0, 0.15);
            z-index: 999;
            position: relative;
        }

        #search {
            flex: 1;
            max-width: 380px;
            padding: 9px 16px;
            border: 1px solid rgba(255, 107, 0, 0.25);
            border-radius: 25px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.06);
            color: #eee;
        }

        #search::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        #search:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        .filter-btn {
            padding: 7px 16px;
            border: 1.5px solid rgba(255, 107, 0, 0.4);
            background: transparent;
            color: rgba(255, 179, 71, 0.8);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }

        .filter-btn:hover {
            background: rgba(255, 107, 0, 0.15);
            border-color: #FF6B00;
            color: #FFB347;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #FF6B00, #FF8C00);
            color: white;
            border-color: transparent;
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.35);
        }

        #map {
            height: calc(100vh - 112px);
            width: 100%;
        }

        /* Pulsing animation for major stops */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(255, 107, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
        }

        @keyframes pulseMajor {
            0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.5); }
            70% { box-shadow: 0 0 0 16px rgba(229, 57, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
        }

        .marker-pin {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .marker-pin:hover {
            transform: scale(1.3);
        }

        .marker-major .marker-pin {
            animation: pulseMajor 2.5s infinite;
        }

        .marker-regular .marker-pin {
            animation: pulse 3s infinite;
        }

        /* Styled popups */
        .leaflet-popup-content-wrapper {
            background: rgba(26, 26, 46, 0.95) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 107, 0, 0.2) !important;
            border-radius: 14px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
            color: #eee !important;
        }

        .leaflet-popup-tip {
            background: rgba(26, 26, 46, 0.95) !important;
            border: 1px solid rgba(255, 107, 0, 0.2) !important;
            border-top: none !important;
            border-left: none !important;
        }

        .leaflet-popup-close-button {
            color: rgba(255, 255, 255, 0.5) !important;
            font-size: 20px !important;
        }

        .leaflet-popup-close-button:hover {
            color: #FF6B00 !important;
        }

        .popup-content {
            min-width: 220px;
            padding: 4px;
        }

        .popup-content h3 {
            color: #FFB347;
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .popup-content .stop-type {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .popup-content .stop-type.major {
            background: rgba(229, 57, 53, 0.2);
            color: #FF8A80;
            border: 1px solid rgba(229, 57, 53, 0.3);
        }

        .popup-content .stop-type.regular {
            background: rgba(255, 107, 0, 0.15);
            color: #FFB347;
            border: 1px solid rgba(255, 107, 0, 0.25);
        }

        .popup-content .routes {
            margin-top: 10px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.65);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
        }

        .popup-content .routes strong {
            color: rgba(255, 255, 255, 0.85);
        }

        .popup-content .route-line {
            padding: 3px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .popup-content .route-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FF6B00;
            flex-shrink: 0;
        }

        .legend {
            background: rgba(26, 26, 46, 0.92) !important;
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            font-size: 0.78rem;
            line-height: 1.9;
            border: 1px solid rgba(255, 107, 0, 0.15);
            color: rgba(255, 255, 255, 0.8);
        }

        .legend h4 {
            margin-bottom: 8px;
            color: #FFB347;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        .legend-dot.major { background: #E53935; box-shadow: 0 0 8px rgba(229, 57, 53, 0.4); }
        .legend-dot.regular { background: #FF6B00; box-shadow: 0 0 8px rgba(255, 107, 0, 0.4); }
        .legend-line { background: linear-gradient(90deg, #FF6B00, #FFB347); height: 3px; width: 14px; border-radius: 2px; }

        #stop-count {
            font-size: 0.82rem;
            color: rgba(255, 179, 71, 0.7);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Style the zoom controls */
        .leaflet-control-zoom a {
            background: rgba(26, 26, 46, 0.9) !important;
            color: #FFB347 !important;
            border-color: rgba(255, 107, 0, 0.2) !important;
            backdrop-filter: blur(8px);
        }

        .leaflet-control-zoom a:hover {
            background: rgba(255, 107, 0, 0.3) !important;
            color: white !important;
        }

        .leaflet-control-attribution {
            background: rgba(26, 26, 46, 0.8) !important;
            color: rgba(255, 255, 255, 0.4) !important;
            font-size: 0.65rem !important;
            backdrop-filter: blur(6px);
        }

        .leaflet-control-attribution a {
            color: rgba(255, 179, 71, 0.6) !important;
        }
    </style>
</head>
<body>

<div id="header">
    <div>
        <h1>Gbaka Cocody - Carte Interactive</h1>
        <div class="subtitle">Arrêts de minibus dans la commune de Cocody, Abidjan</div>

    <div class="logo">🚐</div>

<div id="controls">
    <input type="text" id="search" placeholder="Rechercher un arrêt..." />
    <button class="filter-btn active" data-filter="all">Tous</button>
    <button class="filter-btn" data-filter="major">Carrefours majeurs</button>
    <button class="filter-btn" data-filter="regular">Arrêts réguliers</button>
    <span id="stop-count"></span>
</div>

<div id="map"></div>

        routes: ["Adjamé - Université", "Plateau - Cocody"]

    // Regular stops

        lng: -3.9730,

        description: "Arrêt dans le quartier résidentiel d'Anono",

    {

    },
    {

    {
        name: "Angré Djibi",

    {

    },

    },

        routes: ["Adjamé - Cocody"]
    }
];

// Initialize the map centered on Cocody
const map = L.map('map').setView([5.3550, -3.9770], 14);

// Dark stylish tile layer (CartoDB Dark Matter)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a> | Gbaka Cocody',
    maxZoom: 19,
    subdomains: 'abcd'
}).addTo(map);

// Custom icons with glow effects
function createIcon(type) {
    const isMajor = type === 'major';
    const size = isMajor ? 20 : 13;
    const color = isMajor ? '#E53935' : '#FF6B00';
    const glowColor = isMajor ? 'rgba(229, 57, 53, 0.35)' : 'rgba(255, 107, 0, 0.3)';
    const innerGlow = isMajor ? 'rgba(255, 138, 128, 0.8)' : 'rgba(255, 179, 71, 0.7)';
    return L.divIcon({
        className: `custom-marker marker-${type}`,
        html: `<div class="marker-pin" style="
            background: radial-gradient(circle at 35% 35%, ${innerGlow}, ${color} 60%);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: ${size * 2}px;
            height: ${size * 2}px;
            box-shadow: 0 0 ${isMajor ? 20 : 14}px ${glowColor}, inset 0 -2px 4px rgba(0,0,0,0.2);
        ">${isMajor ? '<div style="width:8px;height:8px;background:rgba(255,255,255,0.4);border-radius:50%;margin:auto;"></div>' : ''}</div>`,
        iconSize: [size * 2, size * 2],
        iconAnchor: [size, size],
        popupAnchor: [0, -size]
    });
}

// Store markers for filtering
let markers = [];

function createPopup(stop) {
    const typeLabel = stop.type === 'major' ? 'Carrefour majeur' : 'Arrêt régulier';
    const typeClass = stop.type === 'major' ? 'major' : 'regular';
    return `
        <div class="popup-content">
            <h3>${stop.name}</h3>
            <span class="stop-type ${typeClass}">${typeLabel}</span>
            <p style="font-size: 0.82rem; color: rgba(255,255,255,0.55); margin: 8px 0; line-height: 1.5;">${stop.description}</p>
            <div class="routes">
                <strong>Lignes desservies</strong>
                ${stop.routes.map(r => `<div class="route-line"><span class="route-dot"></span> ${r}</div>`).join('')}
            </div>
        </div>
    `;
}

function renderStops(filter = 'all', searchTerm = '') {
    // Remove existing markers
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const filtered = gbakaStops.filter(stop => {
        const matchFilter = filter === 'all' || stop.type === filter;
        const matchSearch = searchTerm === '' ||
            stop.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            stop.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
            stop.routes.some(r => r.toLowerCase().includes(searchTerm.toLowerCase()));
        return matchFilter && matchSearch;
    });

    filtered.forEach(stop => {
        const marker = L.marker([stop.lat, stop.lng], { icon: createIcon(stop.type) })
            .bindPopup(createPopup(stop))
            .addTo(map);
        markers.push(marker);
    });

    document.getElementById('stop-count').textContent = `${filtered.length} arrêt${filtered.length > 1 ? 's' : ''}`;
}

// Draw approximate route lines connecting major stops
const majorStops = gbakaStops.filter(s => s.type === 'major');
const routeCoords = majorStops
    .sort((a, b) => a.lng - b.lng)
    .map(s => [s.lat, s.lng]);

L.polyline(routeCoords, {
    color: '#FF6B00',
    weight: 2.5,
    opacity: 0.35,
    dashArray: '6, 10',
    lineCap: 'round'
}).addTo(map);

// Glow line underneath for neon effect
L.polyline(routeCoords, {
    color: '#FF6B00',
    weight: 8,
    opacity: 0.08,
    lineCap: 'round'
}).addTo(map);

// Add Cocody boundary outline (approximate)
const cocodyBounds = [
    [5.330, -4.005],
    [5.330, -3.940],
    [5.345, -3.940],
    [5.360, -3.945],
    [5.380, -3.945],
    [5.385, -3.970],
    [5.380, -3.995],
    [5.360, -4.005],
    [5.330, -4.005]
];

L.polygon(cocodyBounds, {
    color: 'rgba(255, 107, 0, 0.35)',
    weight: 1.5,
    fillColor: '#FF6B00',
    fillOpacity: 0.04,
    dashArray: '4, 8'
}).addTo(map);

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
        <h4>Légende</h4>
        <div class="legend-item"><div class="legend-dot major"></div> Carrefour majeur</div>
        <div class="legend-item"><div class="legend-dot regular"></div> Arrêt régulier</div>
        <div class="legend-item"><div class="legend-line"></div> Itinéraire approximatif</div>
    `;
    return div;
};
legend.addTo(map);

// Filter buttons
let currentFilter = 'all';
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderStops(currentFilter, document.getElementById('search').value);
    });
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
    renderStops(currentFilter, e.target.value);
});

// Initial render
renderStops();
</script>

</body>
</html>
